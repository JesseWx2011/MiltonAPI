name: Radar Image upload

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python script to generate plot
        run: python ./scripts/Image_Generate.py

      - name: Commit and push plot to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Radar Image Updated (MOB)" || echo "No changes to commit"
          git push

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-upload
    steps:
      - uses: actions/checkout@master
      - name: ftp-upload-action
        uses: GenieTim/ftp-action@v4.0.1
        with:
          url: '31.170.161.144'
          files: git diff --name-only HEAD~
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
