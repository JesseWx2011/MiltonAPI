name: Generate and Upload Matplotlib Plot

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Optional: runs daily, or trigger manually via workflow_dispatch
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit and push changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy

      - name: Run Python script to generate plot
        run: python ./scripts/Image_Generate.py

      - name: Commit and push plot to GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add frame_000.png
          git commit -m "Auto-generate Matplotlib plot [skip ci]" || echo "No changes to commit"
          git push
